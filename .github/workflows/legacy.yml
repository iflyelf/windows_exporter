name: Build legacy windows_exporter (Win7/Server 2008 R2)

# 最新版 windows_exporter（v0.30+，Go 1.21+）不再支持 Windows 7 / 8 / 8.1 /
# Server 2008 R2 / 2012 / 2012 R2。此工作流使用官方 v0.23.1（Go 1.20 可构建）
# 单独产出 legacy 资产，并移植本仓库的 hardware_info 采集器。
on:
  workflow_dispatch:
  schedule:
    # 每天 22:20（Asia/Shanghai）构建一次，避开主构建任务
    - cron: '20 14 * * *'
  push:
    paths:
      - '.github/workflows/legacy.yml'
      - 'my_collectors/legacy/**'

permissions:
  contents: write

concurrency:
  group: windows_exporter-legacy-release
  cancel-in-progress: true

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 检出 windows_exporter v0.23.1 源码
        run: |
          git clone --depth 1 --branch v0.23.1 \
            https://github.com/prometheus-community/windows_exporter.git legacy_src

      - name: 注入 legacy 版 hardware_info 采集器
        run: |
          # v0.23.1 使用旧的 Collector 接口，不能直接编译 v0.32 的插件；
          # my_collectors/legacy/hardware_info_collector.go 是 WMI 移植版。
          cp my_collectors/legacy/hardware_info_collector.go \
             legacy_src/collector/hardware_info.go

      - name: 设置 Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: legacy_src/go.sum

      - name: 构建 legacy 多架构二进制
        working-directory: legacy_src
        run: |
          set -euo pipefail
          VERSION="0.23.1-iflyelf"
          REVISION="${GITHUB_SHA::12}"
          BRANCH="legacy"
          BUILDUSER="iflyelf"
          BUILDDATE="$(TZ='Asia/Shanghai' date +'%Y-%m-%dT%H:%M:%S+08:00')"
          LDFLAGS="-s -w \
            -X 'github.com/prometheus/common/version.Version=${VERSION}' \
            -X 'github.com/prometheus/common/version.Branch=${BRANCH}' \
            -X 'github.com/prometheus/common/version.Revision=${REVISION}' \
            -X 'github.com/prometheus/common/version.BuildUser=${BUILDUSER}' \
            -X 'github.com/prometheus/common/version.BuildDate=${BUILDDATE}'"
          mkdir -p ../.build/windows-amd64 ../.build/windows-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="$LDFLAGS" -o ../.build/windows-amd64/windows_exporter-amd64-legacy.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath \
            -ldflags="$LDFLAGS" -o ../.build/windows-arm64/windows_exporter-arm64-legacy.exe .
          cd ..
          sha256sum \
            .build/windows-amd64/windows_exporter-amd64-legacy.exe \
            .build/windows-arm64/windows_exporter-arm64-legacy.exe > .build/legacy-sha256sums.txt
          ls -lh .build/windows-amd64/*.exe .build/windows-arm64/*.exe
          cat .build/legacy-sha256sums.txt

      - name: 验证 Go 版本与采集器
        run: |
          set -euo pipefail
          for f in .build/windows-amd64/windows_exporter-amd64-legacy.exe \
                   .build/windows-arm64/windows_exporter-arm64-legacy.exe; do
            echo "== $f =="
            strings -a "$f" | grep -aoE 'go1\.20(\.[0-9]+)?' | sort -u | head -1
            strings -a "$f" | grep -q 'hardware_info'
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows_exporter-legacy-binaries
          path: |
            .build/windows-amd64/windows_exporter-amd64-legacy.exe
            .build/windows-arm64/windows_exporter-arm64-legacy.exe
            .build/legacy-sha256sums.txt

      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          overwrite_files: true
          files: |
            .build/windows-amd64/windows_exporter-amd64-legacy.exe
            .build/windows-arm64/windows_exporter-arm64-legacy.exe
            .build/legacy-sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
